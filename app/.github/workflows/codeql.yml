name: "CodeQL Security Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '30 1 * * 1' # Executa toda segunda-feira às 01:30

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ] 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Inicializa o CodeQL
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix:language }}

    # 2. Configura o Node.js para compilar o projeto Next.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # 3. Instala dependências e faz o build (fundamental para o Next.js analisar rotas e Server Actions)
    - name: Install dependencies and build Next.js
      run: |
        npm ci
        npm run build

    # 4. Executa a análise de segurança
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix:language }}"